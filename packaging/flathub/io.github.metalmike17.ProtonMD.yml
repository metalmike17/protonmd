app-id: io.github.metalmike17.ProtonMD
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: protonmd
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # read the host's /usr to verify 32-bit libraries, gamemode, winetricks
  - --filesystem=host-os:ro
  # Steam libraries (native and Flatpak Steam, plus external drives); read-write for the reset/clear fixes
  - --filesystem=~/.local/share/Steam
  - --filesystem=~/.steam
  - --filesystem=~/.var/app/com.valvesoftware.Steam
  - --filesystem=/run/media
  - --filesystem=/mnt
modules:
  - name: protonmd
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/python3/protonmd-pkg
      - cp -r protonmd /app/lib/python3/protonmd-pkg/
      - install -Dm755 protonmd.sh /app/bin/protonmd
      - sed -i 's|^exec|export PYTHONPATH=/app/lib/python3/protonmd-pkg; exec|' /app/bin/protonmd
      - install -Dm644 data/io.github.metalmike17.ProtonMD.desktop /app/share/applications/io.github.metalmike17.ProtonMD.desktop
      - install -Dm644 data/io.github.metalmike17.ProtonMD.metainfo.xml /app/share/metainfo/io.github.metalmike17.ProtonMD.metainfo.xml
      - install -Dm644 data/io.github.metalmike17.ProtonMD.svg /app/share/icons/hicolor/scalable/apps/io.github.metalmike17.ProtonMD.svg
    sources:
      - type: git
        url: https://github.com/metalmike17/protonmd.git
        tag: v0.1.2
        commit: 13de18da52f6d97403451058453a3a50f39b2083
