<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <clipPath id="c"><rect x="3" y="3" width="122" height="122" rx="28"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#161B26"/><stop offset="1" stop-color="#07080C"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00C8D6"/><stop offset="1" stop-color="#FF2BD6"/></linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" fill-opacity=".28"/></pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="3" y="3" width="122" height="122" rx="28" fill="url(#bg)"/>
  <rect x="3" y="3" width="122" height="122" rx="28" fill="url(#scan)"/>
  <g clip-path="url(#c)"><circle cx="28" cy="26" r="42" fill="#FF2BD6" fill-opacity=".10"/><circle cx="104" cy="106" r="46" fill="#00C8D6" fill-opacity=".10"/></g>
  <!-- circuit traces -->
  <g fill="none" stroke="#00C8D6" stroke-opacity=".55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 98H34L42 90"/><path d="M114 30H96L88 38"/><path d="M14 38H26"/><path d="M102 98H114"/>
  </g>
  <g fill="#00C8D6" fill-opacity=".8"><circle cx="42" cy="90" r="2.6"/><circle cx="88" cy="38" r="2.6"/></g>
